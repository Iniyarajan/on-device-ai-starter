name: OnDeviceAISample
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  bundleIdPrefix: com.iniyarajan.ondeviceai
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"             # ad-hoc: enough for the simulator; set a team for device builds
    DEVELOPMENT_TEAM: ""
targets:
  OnDeviceAISample:
    type: application
    platform: iOS
    sources:
      - path: Sample/Sources
      - path: Sample/Assets/sample-notice.png
        buildPhase: resources
    info:
      path: Sample/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: OnDevice AI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iniyarajan.ondeviceai.sample
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
  OnDeviceAISampleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SampleTests]
    dependencies:
      - target: OnDeviceAISample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iniyarajan.ondeviceai.sample.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OnDeviceAISample.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OnDeviceAISample"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OnDeviceAISample:
    build:
      targets: { OnDeviceAISample: all, OnDeviceAISampleTests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [OnDeviceAISampleTests]
